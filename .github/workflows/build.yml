name: Build NRO

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_NAME: css_first

jobs:
  plugin:
    name: Plugin NRO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: css_first
          cache-all-crates: true

      - name: Install cargo-skyline
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo install --git https://github.com/jam1garner/cargo-skyline --locked --force
          cargo-skyline skyline update-std

      - name: Build release NRO
        run: cargo skyline build --release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcss_first
          path: target/aarch64-skyline-switch/release/lib${{ env.PLUGIN_NAME }}.nro
